<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Меню">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Меню на неделю</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;
  --bg:#f2f2f7;--card:#ffffff;--text:#111114;--muted:#6b6b73;--line:#e5e5ea;
  --accent:#f26b1d;--accent-soft:#fff0e5;--ok:#2fb35a;--bar:rgba(249,249,251,.92);
  --p:#2f7cf6;--f:#e6a100;--c:#2fb35a;--danger:#e5484d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#9a9aa1;--line:#2c2c2e;
  --accent:#ff8a3d;--accent-soft:#3a2414;--ok:#38c766;--bar:rgba(22,22,24,.92);
  --p:#5b9bff;--f:#ffc23d;--c:#38c766;--danger:#ff6369}
}
/* ---- фиксированная вёрстка: без зума, без горизонтальной прокрутки ---- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
html,body{margin:0;background:var(--bg);color:var(--text);width:100%;max-width:100%}
body{font:16px/1.45 var(--font);overflow-x:hidden;overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px!important}
body.noscroll{position:fixed;left:0;right:0;overflow:hidden}
button{font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer}
a,button,input,select,textarea,label,summary,.row,[data-close]{touch-action:manipulation}
img,svg{flex:none}
header,main{max-width:640px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 16px) 16px 4px;display:flex;align-items:flex-end;gap:10px}
header .ht{flex:1;overflow:hidden}
h1{font-size:30px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{flex:none;border:0;border-radius:999px;padding:5px 10px;font:600 12px/1 var(--font);background:var(--card);color:var(--muted);margin-bottom:4px;cursor:pointer;white-space:nowrap}
#st.ok{color:var(--ok)}#st.saving{color:var(--accent)}#st.off{color:var(--danger)}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:16px;padding:14px 14px 12px;margin-bottom:12px;overflow:hidden}
.slot{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;min-height:16px}
.title{font-size:18px;font-weight:700;margin:2px 0 10px;line-height:1.25;overflow-wrap:anywhere}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mac{background:var(--bg);border-radius:12px;padding:8px 10px}
.sheet .mac{background:var(--card)}
.sheet .card .mac{background:var(--bg)}
.mac b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.mac .kc{font-size:20px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mac .kc small{font-size:13px;font-weight:600;color:var(--muted)}
.bju{display:flex;gap:8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bju .p{color:var(--p)}.bju .f{color:var(--f)}.bju .c{color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:2px 0 4px;width:64px}
th:first-child{text-align:left;width:auto}
td{padding:7px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;white-space:normal;padding-right:8px;overflow-wrap:anywhere}
.batch td:last-child{width:128px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
summary{color:var(--accent);font-weight:600;font-size:15px;list-style:none;cursor:pointer;padding:2px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:" ›";display:inline-block;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
.batch{margin:8px 0 4px}
.steps{margin:10px 0 2px;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 12px 36px;font-size:15px;counter-increment:s;overflow-wrap:anywhere}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.tip{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:4px 0 6px}
.tip b{color:var(--accent)}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin:0 0 10px;background:var(--bg);color:var(--muted)}
.tag.cook{background:var(--accent-soft);color:var(--accent)}
.guide ul{margin:8px 0 4px;padding-left:20px;font-size:15px}
.guide li{margin-bottom:6px}

/* дни и недели */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 14px}
.day{border:0;border-radius:12px;background:var(--card);color:var(--text);height:56px;padding:0;font:600 15px/1.1 var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;overflow:hidden}
.day small{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap}
.day.now::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day.on{background:var(--accent);color:#fff}
.day.on small{color:rgba(255,255,255,.85)}
.day.on.now::after{background:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px}
.chip{border:0;border-radius:12px;height:52px;padding:0 6px;background:var(--card);color:var(--text);font:600 14px/1.2 var(--font);cursor:pointer;overflow:hidden;white-space:nowrap}
.chip small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.chip.on{background:var(--accent);color:#fff}
.chip.on small{color:rgba(255,255,255,.85)}
.dayblock{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.dayhead{display:flex;align-items:baseline;gap:6px;padding:10px 14px 6px;white-space:nowrap}
.dayhead span{color:var(--muted);font-size:14px}
.dayhead small{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.dayhead.today b{color:var(--accent)}
.slotrow{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;border:0;border-top:1px solid var(--line);background:none;color:var(--text);text-align:left;padding:10px 14px;font:15px/1.3 var(--font);cursor:pointer}
.slotrow .sl{flex:none;width:46px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.slotrow .sn{flex:1;overflow-wrap:anywhere}
.slotrow.none .sn{color:var(--muted)}
.slotrow.sel{background:var(--accent-soft)}
.mini{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted);white-space:nowrap}
.mini.cook{background:var(--accent-soft);color:var(--accent)}
.swapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.swapbar button{flex:none;border:0;background:var(--card);color:var(--accent);border-radius:10px;padding:7px 12px;font:600 14px var(--font);cursor:pointer}

/* блюда */
.dishrow{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--text);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.dishrow .dn{display:block;font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.dishrow .dk{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}

/* кнопки */
.toolbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:12px 0 4px}
.btn{border:0;border-radius:12px;min-height:46px;padding:10px;font:600 15px/1.15 var(--font);background:var(--card);color:var(--accent);cursor:pointer}
.btn.on,.btn.primary{background:var(--accent);color:#fff}
.btn.wide{display:block;width:100%;margin:8px 0}
.btn.danger{color:var(--danger)}
.btn.confirm{background:var(--danger)!important;color:#fff!important}
.btn:disabled{opacity:.6}
.del{flex:none;border:0;background:none;color:var(--muted);font-size:22px;width:26px;height:32px;padding:0;cursor:pointer;line-height:1}

/* покупки */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.group{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px}
.gtitle{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 14px 4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
.gtitle + .row{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.row.done .box{background:var(--ok);border-color:var(--ok)}
.box svg{opacity:0;width:14px;height:14px}
.row.done .box svg{opacity:1}
.name{flex:1;font-size:16px;overflow-wrap:anywhere}
.qty{flex:none;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done .name,.row.done .qty{color:var(--muted);text-decoration:line-through}
.add{display:flex;gap:8px;margin:4px 0 12px}
.add input{flex:1;border:0;border-radius:12px;height:46px;padding:0 12px;font:16px var(--font);background:var(--card);color:var(--text)}
.add button{flex:none;width:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 22px var(--font)}
.empty{text-align:center;color:var(--muted);padding:20px 0}

/* шторка */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:calc(88vh - env(safe-area-inset-top));max-height:calc(88dvh - env(safe-area-inset-top));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
#sheet.open{pointer-events:auto}
#sheet.open .sheet-bg{opacity:1}
#sheet.open .sheet{transform:none}
#sheet.open .sheet[style*=translateY]{transition:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-bg{cursor:pointer}
#sb{position:relative}
.sh-xw{position:sticky;top:0;height:0;z-index:3;display:flex;justify-content:flex-end}
.sh-x{width:32px;height:32px;margin:2px -4px 0 0;border:0;border-radius:50%;background:var(--card);color:var(--muted);font:700 15px/32px var(--font);text-align:center;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sh-title,.sh-sub{padding-right:40px}
#sb > .card:first-of-type .slot,#sb > .card:first-of-type .title{padding-right:34px}
.sh-title{font-size:20px;font-weight:800;margin:4px 0 2px;overflow-wrap:anywhere}
.sh-sub{color:var(--muted);margin-bottom:12px;overflow-wrap:anywhere}
.sh-actions{display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden}
.sh-actions button{border:0;border-top:1px solid var(--line);background:none;color:var(--accent);text-align:left;min-height:50px;padding:12px 14px;font:600 16px var(--font);cursor:pointer}
.sh-actions button:first-child{border-top:0}
.sh-actions .danger{color:var(--danger)}
.kv{background:var(--card);border-radius:14px;padding:4px 14px;margin:10px 0}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}

/* формы */
.search,.fl input,.fl textarea,.ed-row select,.ed-row input,.newing input,.newing select{width:100%;border:1px solid var(--line);border-radius:10px;height:44px;padding:0 11px;font:16px var(--font);font-family:inherit;background:var(--card);color:var(--text)}
.fl textarea{height:auto;padding:10px 11px;resize:vertical}
.search{margin:8px 0 10px}
.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.fl input,.fl textarea{margin-top:6px;font-weight:400}
.ed-head,.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 26px;gap:6px;align-items:center}
.ed-head{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.ed-row{margin-bottom:6px}
.ed-row select{padding:0 6px;text-overflow:ellipsis}
.ed-row input{padding:0 4px;text-align:center}
.newing{background:var(--card);border-radius:14px;padding:2px 12px 8px;margin:8px 0}
.newing input,.newing select{margin-bottom:6px;background:var(--bg)}
.ni-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ed-err{color:var(--danger);font-weight:600;font-size:14px;min-height:18px;margin-top:8px}

/* вход */
body:not(.ready) header, body:not(.ready) main, body:not(.ready) nav{display:none}
body.ready #login{display:none}
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(24px + env(safe-area-inset-bottom))}
#loginForm{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:26px 20px 20px;text-align:center}
.lg-icon{font-size:40px;line-height:1}
#loginForm h2{margin:10px 0 4px;font-size:24px;font-weight:800}
.lg-sub{margin:0 0 16px;color:var(--muted);font-size:15px}
#loginForm input{display:block;width:100%;height:48px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:16px var(--font);font-family:inherit;background:var(--bg);color:var(--text)}
#loginForm .lg-db{text-align:left;margin:6px 0 4px;border-top:1px solid var(--line);padding-top:12px}
#loginForm .lg-db b{display:block;font-size:14px;margin-bottom:2px}
#loginForm .lg-db p{margin:0 0 10px;font-size:13px;color:var(--muted)}
#loginForm button{width:100%;height:50px;margin-top:4px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 16px var(--font);cursor:pointer}
#loginForm button:disabled{opacity:.6}
.lg-err{min-height:20px;margin-top:10px;color:var(--danger);font-size:14px;font-weight:600}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;height:56px;border:0;background:none;color:var(--muted);padding:0;font:600 11px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm" autocomplete="on">
    <div class="lg-icon">🍗</div>
    <h2>Меню на неделю</h2>
    <p class="lg-sub">Войди, чтобы открыть меню</p>
    <input id="lgUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Логин" required>
    <input id="lgPass" name="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <div class="lg-db" id="lgDb">
      <b>Подключение к базе</b>
      <p>Нужно один раз на каждом телефоне.</p>
      <input id="lgOwner" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Владелец (GitHub)">
      <input id="lgRepo" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Репозиторий базы">
      <input id="lgToken" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Токен GitHub (github_pat_…)">
    </div>
    <button type="submit" id="lgBtn">Войти</button>
    <div id="lgErr" class="lg-err"></div>
  </form>
</div>
<header>
  <div class="ht"><h1 id="h"></h1><div class="sub" id="hs"></div></div>
  <button id="st" data-a="settings">…</button>
</header>
<main id="app"></main>
<nav>
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Сегодня</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>Неделя</button>
  <button data-tab="dishes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7M8 11h7"/></svg>Блюда</button>
  <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Покупки</button>
</nav>
<div id="sheet"><div class="sheet-bg" data-close="1"></div><div class="sheet" id="sheetBox"><div class="grab"></div><div id="sb"></div></div></div>

<script>
/* ============================================================
   Настройки по умолчанию
   ============================================================ */
const DEFAULT_OWNER = 'mat3eO421';
const DEFAULT_REPO  = 'menu-db';
const DB_PATH       = 'db.json';
/*AUTH*/const AUTH = {"salt":"oGobObw2YLXgE9YLvDpMRQ==","iter":250000,"hash":"WWZXW3AD5wpR2lQsS3s6y/JAVynyKms38DwhSdrfiok="};/*AUTH-END*/   // проверка логина/пароля (подставляется при сборке)

const WHO = ['Настя','Артём'];
const SLOTS = ['Обед','Ужин'];
const DN = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const CATS = ['Мясо','Молочное','Овощи','Заморозка','Крупы и макароны','Прочее','Специи и мелочи','Своё'];
const SIDES = ['rice','buckwheat','pasta','potato'];

/* ===== Локальное хранилище (только настройки и кэш) ===== */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let tab = load('m.tab','today'); if(!['today','week','dishes','shop'].includes(tab)) tab='today';
let hide = load('m.hide',false);
let cfg = load('m.cfg',null);      // {owner, repo, token}
let db = load('m.db',null);        // кэш базы (с применёнными локальными изменениями)
let remote = load('m.remote',null);// последняя версия с сервера
let sha = load('m.sha',null);
let queue = load('m.queue',[]);    // изменения, ещё не записанные в базу
let lastSync = load('m.synced',0);
let selDay = (new Date().getDay()+6)%7;
let weekOff = 0, started = false;
let swapFrom = null, slotCtx = null, pickTarget = null, ed = null;

/* ===== Утилиты ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
const addDays = (d,n) => {const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dLabel = d => d.getDate()+' '+MON[d.getMonth()];
function weekLabel(m){const e=addDays(m,6);return m.getMonth()===e.getMonth()?`${m.getDate()}–${e.getDate()} ${MON[e.getMonth()]}`:`${dLabel(m)} – ${dLabel(e)}`}
const thisMon = () => monday(new Date());
const nextShopOff = () => {const w=new Date().getDay();return (w===6||w===0)?1:0}; // с субботы — следующая неделя
const viewMon = () => addDays(thisMon(),7*weekOff);
const dayWord = n => n===1?'1 день':(n<5?n+' дня':n+' дней');
const num = v => {const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
function fmt(g){ if(g>=1000){const kg=Math.round(g/100)/10;return String(kg).replace('.',',')+' кг'} return Math.round(g)+' г' }
const emptyPlan = () => Array.from({length:7},()=>[null,null]);
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));

/* ============================================================
   Операции над базой. Каждое изменение — маленькая операция.
   Сначала применяется локально, потом записывается в GitHub
   поверх самой свежей версии (так правки с двух телефонов не теряются).
   ============================================================ */
function norm(d){
  d.ingredients=d.ingredients||{}; d.dishes=d.dishes||{}; d.plans=d.plans||{}; d.shop=d.shop||{};
  d.defaultPlan=d.defaultPlan||emptyPlan(); return d;
}
function applyOp(d,o){
  norm(d);
  const sh = wk => (d.shop[wk]=d.shop[wk]||{checked:{},extra:[]});
  switch(o.t){
    case 'planInit': if(!d.plans[o.wk]) d.plans[o.wk]=clone(o.plan); break;
    case 'plan':     d.plans[o.wk]=clone(o.plan); break;
    case 'slot':     if(!d.plans[o.wk]) d.plans[o.wk]=emptyPlan(); d.plans[o.wk][o.d][o.s]=o.id; break;
    case 'dish':     d.dishes[o.dish.id]=clone(o.dish); break;
    case 'delDish':  delete d.dishes[o.id]; break;
    case 'ing':      d.ingredients[o.key]=clone(o.val); break;
    case 'check':    { const c=sh(o.wk).checked; if(o.v) c[o.id]=1; else delete c[o.id]; break }
    case 'reset':    sh(o.wk).checked={}; break;
    case 'shopAdd':  sh(o.wk).extra.push(clone(o.item)); break;
    case 'shopDel':  { const s=sh(o.wk); s.extra=s.extra.filter(x=>x.id!==o.id); delete s.checked['c:'+o.id]; break }
    case 'prune':    ['plans','shop'].forEach(k=>Object.keys(d[k]).forEach(w=>{if(w<o.before) delete d[k][w]})); break;
  }
  return d;
}
const OP_NAMES = {planInit:'Новая неделя',plan:'Меню недели',slot:'Меню недели',dish:'Блюдо',delDish:'Удаление блюда',ing:'Продукт',check:'Покупки',reset:'Покупки',shopAdd:'Покупки',shopDel:'Покупки',prune:'Очистка старых недель'};
function doOp(o){
  applyOp(db,o); queue.push(o);
  save('m.db',db); save('m.queue',queue);
  scheduleFlush();
}

/* ===== GitHub API ===== */
const apiUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${DB_PATH}`;
const ghHeaders = () => ({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghGet(){
  const r = await fetch(apiUrl()+'?nocache='+Date.now(), {headers:ghHeaders(), cache:'no-store'});
  if(!r.ok){ const e=new Error('http'); e.status=r.status; throw e }
  const j = await r.json();
  return {data:norm(JSON.parse(b64dec(j.content))), sha:j.sha};
}
async function ghPut(data, prevSha, message){
  data.updated = new Date().toISOString();
  return fetch(apiUrl(), {method:'PUT', headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),
    body: JSON.stringify({message, content:b64enc(JSON.stringify(data,null,2)+'\n'), sha:prevSha})});
}
function errText(e){
  if(e&&e.status===401) return 'Токен не подошёл или истёк';
  if(e&&e.status===403) return 'У токена нет доступа к репозиторию';
  if(e&&e.status===404) return 'Не найден репозиторий или db.json — проверь названия';
  return 'Нет связи с GitHub';
}

/* ===== Синхронизация ===== */
let flushTimer=null, flushing=false, refreshing=false, syncState='ok', syncErr='';
function setStatus(s,err){
  syncState=s; syncErr=err||'';
  const el=$('st'); if(!el) return;
  el.className = s==='ok'?'ok':s==='saving'?'saving':'off';
  el.textContent = s==='ok'?'✓ сохранено':s==='saving'?'⟳ сохраняю':(queue.length?'⚠ не сохранено':'⚠ нет связи');
}
function scheduleFlush(ms){ clearTimeout(flushTimer); setStatus('saving'); flushTimer=setTimeout(flush, ms==null?700:ms) }
async function flush(){
  if(flushing||!queue.length||!cfg) { if(!queue.length) setStatus('ok'); return }
  flushing=true; setStatus('saving');
  try{
    for(let attempt=0; attempt<4; attempt++){
      const cur = await ghGet();
      const ops = queue.slice();
      const merged = clone(cur.data); ops.forEach(o=>applyOp(merged,o));
      const names=[...new Set(ops.map(o=>OP_NAMES[o.t]||'Изменения'))].join(', ');
      const r = await ghPut(merged, cur.sha, 'Меню: '+names);
      if(r.ok){
        const j=await r.json();
        sha=j.content.sha; remote=merged; queue=queue.slice(ops.length);
        rebuild(); lastSync=Date.now(); save('m.synced',lastSync);
        setStatus(queue.length?'saving':'ok'); softRender();
        if(queue.length){ flushing=false; return flush() }
        return;
      }
      if(r.status===409||r.status===422) continue;   // кто-то записал раньше — берём свежую версию и повторяем
      const e=new Error('http'); e.status=r.status; throw e;
    }
    throw new Error('conflict');
  }catch(e){
    setStatus('off', errText(e));
    clearTimeout(flushTimer); flushTimer=setTimeout(flush, 8000);
  }finally{ flushing=false }
}
function rebuild(){
  db = clone(remote); queue.forEach(o=>applyOp(db,o));
  save('m.remote',remote); save('m.sha',sha); save('m.db',db); save('m.queue',queue);
}
async function refresh(strict){
  if(refreshing||flushing||!cfg) return;
  refreshing=true;
  try{
    const cur = await ghGet();
    if(cur.sha!==sha || !remote){ remote=cur.data; sha=cur.sha; rebuild(); softRender() }
    lastSync=Date.now(); save('m.synced',lastSync);
    if(queue.length) scheduleFlush(0); else setStatus('ok');
  }catch(e){
    if(strict) throw e;
    setStatus('off', errText(e));
  }finally{ refreshing=false }
}
function softRender(){
  if(!started) return;
  const a=document.activeElement;
  if(a && $('app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // не мешаем вводу
  render();
}
document.addEventListener('visibilitychange',()=>{
  if(!started) return;
  if(document.visibilityState==='visible') refresh(); else if(queue.length) flush();
});
setInterval(()=>{ if(started && document.visibilityState==='visible') refresh() }, 20000);

/* ===== База блюд ===== */
const ING = () => db.ingredients;
const dishList = () => Object.values(db.dishes);
const dishMap = () => db.dishes;
function macro(items,i){
  const I=ING(), r={k:0,p:0,f:0,u:0};
  items.forEach(it=>{const x=I[it[0]];if(!x)return;const g=num(it[i])/100;r.k+=(x.k||0)*g;r.p+=(x.p||0)*g;r.f+=(x.f||0)*g;r.u+=(x.u||0)*g});
  return {k:Math.round(r.k),p:Math.round(r.p),f:Math.round(r.f),u:Math.round(r.u)};
}

/* ===== Меню по неделям ===== */
function getPlan(wk){
  if(!db.plans[wk]){
    const prev = Object.keys(db.plans).filter(k=>k<wk).sort().pop();
    doOp({t:'planInit', wk, plan: prev?db.plans[prev]:db.defaultPlan});
  }
  return db.plans[wk];
}
function batchInfo(plan,d,s){
  const id=plan[d][s]; if(!id) return null;
  let start=d; while(start>0 && plan[start-1][s]===id) start--;
  let n=0; while(start+n<7 && plan[start+n][s]===id) n++;
  return {start,n,cook:start===d};
}
const setSlot = (wk,d,s,id) => doOp({t:'slot',wk,d,s,id});

/* ===== Карточка блюда ===== */
function fmtText(s,dish,n){
  let t = esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return t.replace(/\{(\w+)(?:\*([\d.]+))?\}/g,(_,k,mul)=>{
    const it=dish.items.find(i=>i[0]===k); if(!it) return '';
    const total=(num(it[1])+num(it[2]))*n;
    return mul?String(Math.round(total*Number(mul)/10)*10):'<b>'+fmt(total)+'</b>';
  });
}
function macBox(i,m){
  return `<div class="mac"><b>${WHO[i]}</b><div class="kc">${m.k} <small>ккал</small></div>
    <div class="bju"><span class="p">Б ${m.p}</span><span class="f">Ж ${m.f}</span><span class="c">У ${m.u}</span></div></div>`;
}
function dishCard(dish,o){
  o=o||{}; const n=o.n||2, I=ING();
  const nm = k => esc(I[k]?I[k].n:'(продукт удалён)');
  const rows = dish.items.map(([k,a,b])=>`<tr><td>${nm(k)}</td><td>${num(a)} г</td><td>${num(b)} г</td></tr>`).join('');
  const batch = dish.items.map(([k,a,b])=>`<tr><td>${nm(k)}</td><td>${fmt((num(a)+num(b))*n)}</td></tr>`).join('');
  const pct = it => {const t=num(it[1])+num(it[2]);return t?Math.round(num(it[1])/t*100):50};
  const ch = dish.items.find(i=>i[0]==='chicken') || dish.items[0];
  const side = dish.items.find(i=>SIDES.includes(i[0]));
  const steps = (dish.steps||[]).length ? `<ol class="steps">${dish.steps.map(s=>`<li>${fmtText(s,dish,n)}</li>`).join('')}</ol>` : '';
  const share = ch ? `<div class="tip"><b>Как делить готовое:</b> взвесь и раздели по весу — ${esc(((I[ch[0]]||{n:''}).n).toLowerCase())}: Насте ${pct(ch)}%, Артёму ${100-pct(ch)}%${side&&side!==ch?`; гарнир: Насте ${pct(side)}%, Артёму ${100-pct(side)}%`:''}.${n>1?` Потом раздели каждую часть на ${n} дн.`:''}</div>` : '';
  return `<div class="card">
    <div class="slot">${o.slot?esc(o.slot):''}${o.slot&&dish.time?' · ':''}${dish.time?'⏱ '+esc(dish.time):''}</div>
    <div class="title">${esc(dish.name)}</div>
    ${o.badge||''}
    <div class="macros">${macBox(0,macro(dish.items,1))}${macBox(1,macro(dish.items,2))}</div>
    <table><tr><th>Порция (сырой вес)</th><th>${WHO[0]}</th><th>${WHO[1]}</th></tr>${rows}</table>
    ${(dish.extra||[]).length?`<div class="note">+ ${esc(dish.extra.join(', ').toLowerCase())}</div>`:''}
    <details ${o.open?'open':''}><summary>Рецепт — партия на ${dayWord(n)} на двоих</summary>
      <table class="batch">${batch}</table>
      ${steps}
      ${share}
    </details>
  </div>`;
}

/* ===== Шапка ===== */
function setHead(t,s){$('h').textContent=t;$('hs').textContent=s}
function weekChips(){
  return `<div class="chips">
    <button class="chip ${weekOff===0?'on':''}" data-week="0">Эта неделя<small>${weekLabel(thisMon())}</small></button>
    <button class="chip ${weekOff===1?'on':''}" data-week="1">Следующая<small>${weekLabel(addDays(thisMon(),7))}</small></button>
  </div>`;
}

/* ===== Сегодня ===== */
function renderToday(){
  const mon=thisMon(), plan=getPlan(ymd(mon)), D=dishMap();
  const today=(new Date().getDay()+6)%7, d=selDay, date=addDays(mon,d);
  setHead(d===today?'Сегодня':DN[d], (d===today?DN[d]+', ':'')+dLabel(date));
  const cookDay = i => [0,1].some(s=>{const b=batchInfo(plan,i,s);return b&&b.cook&&D[plan[i][s]]});
  let html = `<div class="days">${DS.map((n,i)=>`<button class="day ${i===d?'on':''} ${i===today?'now':''}" data-day="${i}"><span>${n}</span><small>${cookDay(i)?'готовка':addDays(mon,i).getDate()}</small></button>`).join('')}</div>`;
  [0,1].forEach(s=>{
    const dish=D[plan[d][s]];
    if(!dish){
      html += `<div class="card"><div class="slot">${SLOTS[s]}</div><div class="title" style="color:var(--muted)">Блюдо не выбрано</div><button class="btn wide" data-tab="week">Открыть конструктор</button></div>`;
      return;
    }
    const b=batchInfo(plan,d,s);
    const badge = b.cook ? `<span class="tag cook">Готовить сегодня — на ${dayWord(b.n)}</span>` : `<span class="tag">Из партии от ${DS[b.start]}</span>`;
    html += dishCard(dish,{slot:SLOTS[s],n:b.n,open:b.cook,badge});
  });
  if(d<6){
    const nxt=[0,1].filter(s=>{const b=batchInfo(plan,d+1,s);return b&&b.cook&&D[plan[d+1][s]]});
    if(nxt.length) html += `<div class="note" style="text-align:center;margin:4px 0 12px">${d===today?'Завтра':DN[d+1]} — новая партия: ${nxt.map(s=>SLOTS[s].toLowerCase()).join(' и ')}</div>`;
  }
  return html;
}

/* ===== Неделя (конструктор) ===== */
function renderWeek(){
  const mon=viewMon(), plan=getPlan(ymd(mon)), D=dishMap();
  const today = weekOff===0 ? (new Date().getDay()+6)%7 : -1;
  setHead('Неделя', 'Конструктор · '+weekLabel(mon));
  let html = weekChips();
  if(swapFrom) html += `<div class="tip swapbar"><span>Выбери, с чем поменять <b>${SLOTS[swapFrom.s].toLowerCase()} ${DS[swapFrom.d]}</b></span><button data-a="swapcancel">Отмена</button></div>`;
  for(let d=0; d<7; d++){
    let tn=0, ta=0;
    [0,1].forEach(s=>{const x=D[plan[d][s]];if(x){tn+=macro(x.items,1).k;ta+=macro(x.items,2).k}});
    html += `<div class="dayblock"><div class="dayhead ${d===today?'today':''}"><b>${DN[d]}</b><span>${dLabel(addDays(mon,d))}</span><small>${tn?`Н ${tn} · А ${ta}`:''}</small></div>`;
    [0,1].forEach(s=>{
      const dish=D[plan[d][s]], b=dish?batchInfo(plan,d,s):null;
      const sel = swapFrom && swapFrom.d===d && swapFrom.s===s;
      const tag = !dish ? '' : (b.cook ? (b.n>1?`<span class="mini cook">на ${dayWord(b.n)}</span>`:'') : `<span class="mini">та же партия</span>`);
      html += `<button class="slotrow ${dish?'':'none'} ${sel?'sel':''}" data-slot="${d},${s}"><span class="sl">${SLOTS[s]}</span><span class="sn">${dish?esc(dish.name):'+ выбрать блюдо'}</span>${tag}</button>`;
    });
    html += `</div>`;
  }
  html += `<div class="note">Тапни по блюду, чтобы заменить, убрать или поменять местами. Одно блюдо два дня подряд — одна партия. Список покупок пересчитывается сам.</div>
    <div class="toolbar"><button class="btn" data-a="copyprev">Как прошлая неделя</button><button class="btn" data-a="stdplan">Стандартное меню</button></div>
    <button class="btn wide danger" data-a="clearweek">Очистить неделю</button>`;
  return html;
}

/* ===== Блюда ===== */
function renderDishes(){
  const list=dishList(), n=list.length;
  const w = (n%10===1&&n%100!==11)?'блюдо':((n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'блюда':'блюд');
  setHead('Блюда', `В базе ${n} ${w}`);
  let html = `<button class="btn primary wide" data-a="newdish" style="margin-top:12px">+ Новое блюдо</button>`;
  html += list.map(x=>{const a=macro(x.items,1),b=macro(x.items,2);
    return `<button class="dishrow" data-dish="${esc(x.id)}"><span class="dn">${esc(x.name)}</span><span class="dk">Н ${a.k} · А ${b.k} ккал · белок ${a.p}/${b.p} г${x.time?' · '+esc(x.time):''}</span></button>`}).join('');
  if(db.guide) html += db.guide;
  html += `<button class="btn wide" data-a="settings">База и аккаунт</button>`;
  return html;
}

/* ===== Покупки ===== */
function shopState(wk){ return (db.shop[wk]) || {checked:{},extra:[]} }
function shopList(wk){
  const plan=getPlan(wk), D=dishMap(), I=ING(), sum={}, extras=new Set();
  plan.forEach(day=>day.forEach(id=>{
    const x=D[id]; if(!x) return;
    x.items.forEach(([k,a,b])=>{sum[k]=(sum[k]||0)+num(a)+num(b)});
    (x.extra||[]).forEach(e=>extras.add(e));
  }));
  const list = Object.entries(sum).filter(([k,g])=>g>0&&I[k]).map(([k,g])=>({id:'i:'+k, n:I[k].n, q:fmt(g), c:I[k].c}));
  [...extras].forEach(e=>list.push({id:'s:'+e, n:e, q:'', c:'Специи и мелочи'}));
  (shopState(wk).extra||[]).forEach(x=>list.push({id:'c:'+x.id, n:x.n, q:'', c:'Своё', custom:x.id}));
  return list;
}
function renderShop(){
  const mon=viewMon(), wk=ymd(mon), list=shopList(wk), ck=shopState(wk).checked||{};
  const done=list.filter(x=>ck[x.id]).length;
  setHead('Покупки', `${weekLabel(mon)} · взято ${done} из ${list.length}`);
  let html = weekChips() + `<div class="progress"><i style="width:${list.length?done/list.length*100:0}%"></i></div>
    <div class="note">Общий список на двоих: отметки видны на обоих телефонах. С субботы открывается следующая неделя.</div>
    <div class="toolbar">
      <button class="btn ${hide?'on':''}" data-a="hide">${hide?'Показать взятое':'Скрыть взятое'}</button>
      <button class="btn" data-a="reset">Сбросить</button>
    </div>
    <form class="add" id="addForm"><input id="addIn" placeholder="Добавить своё…" enterkeyhint="done" autocomplete="off"><button type="submit">+</button></form>`;
  const cats=[...CATS, ...[...new Set(list.map(x=>x.c))].filter(c=>!CATS.includes(c))];
  let any=false;
  cats.forEach(cat=>{
    let items=list.filter(x=>x.c===cat);
    if(hide) items=items.filter(x=>!ck[x.id]);
    if(!items.length) return;
    any=true;
    items.sort((a,b)=>(!!ck[a.id])-(!!ck[b.id]));
    html += `<div class="group"><div class="gtitle">${esc(cat)}</div>` + items.map(x=>`
      <div class="row ${ck[x.id]?'done':''}" data-id="${esc(x.id)}">
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <span class="name">${esc(x.n)}</span>
        ${x.q?`<span class="qty">${x.q}</span>`:''}
        ${x.custom?`<button class="del" data-del="${x.custom}" aria-label="Удалить">×</button>`:''}
      </div>`).join('') + `</div>`;
  });
  if(!any) html += `<div class="empty">${list.length?'Всё взято 🎉':'Меню на эту неделю пустое — собери его во вкладке «Неделя»'}</div>`;
  return html;
}

/* ===== Шторка ===== */
let lockY=0, sheetOpen=false;
function lockScroll(){
  if(sheetOpen) return; sheetOpen=true;
  lockY=window.scrollY||0;
  document.body.style.top=(-lockY)+'px'; document.body.classList.add('noscroll');
}
function unlockScroll(){
  if(!sheetOpen) return; sheetOpen=false;
  document.body.classList.remove('noscroll'); document.body.style.top='';
  window.scrollTo(0,lockY);
}
function openSheet(html,keepScroll){
  const box=$('sheetBox'), top=box.scrollTop;
  $('sb').innerHTML = `<div class="sh-xw"><button class="sh-x" data-close="1" aria-label="Закрыть">✕</button></div>` + html;
  lockScroll(); $('sheet').classList.add('open'); box.style.transform='';
  box.scrollTop = keepScroll?top:0;
}
function closeSheet(){
  $('sheet').classList.remove('open'); $('sheetBox').style.transform='';
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  unlockScroll(); ed=null; pickTarget=null; slotCtx=null;
}

function openSlotSheet(d,s){
  const plan=getPlan(ymd(viewMon())), dish=dishMap()[plan[d][s]];
  if(!dish) return openPicker(d,s);
  slotCtx={d,s};
  openSheet(`<div class="sh-title">${SLOTS[s]} · ${DN[d]}</div><div class="sh-sub">${esc(dish.name)}</div>
    <div class="sh-actions">
      <button data-a="pick">Заменить блюдо</button>
      ${d<6?`<button data-a="repeat">Повторить на ${DN[d+1].toLowerCase()} (одна партия)</button>`:''}
      <button data-a="swap">Поменять местами с другим</button>
      <button data-a="viewslot">Открыть рецепт</button>
      <button class="danger" data-a="clearslot">Убрать из меню</button>
    </div>`);
}
function openPicker(d,s){
  pickTarget={d,s};
  openSheet(`<div class="sh-title">${SLOTS[s]} · ${DN[d]}</div>
    <input class="search" id="pickSearch" placeholder="Поиск блюда…" autocomplete="off">
    <div id="pickList">${dishList().map(x=>{const a=macro(x.items,1).k,b=macro(x.items,2).k;
      return `<button class="dishrow" data-pick="${esc(x.id)}" data-name="${esc(x.name.toLowerCase())}"><span class="dn">${esc(x.name)}</span><span class="dk">Н ${a} · А ${b} ккал${x.time?' · '+esc(x.time):''}</span></button>`}).join('')}</div>
    <button class="btn primary wide" data-a="newdish">+ Новое блюдо</button>`);
}
function openDishView(id,n){
  const dish=dishMap()[id]; if(!dish) return;
  openSheet(dishCard(dish,{n:n||2,open:true}) + `
    <div class="toolbar"><button class="btn" data-a="editdish" data-id="${esc(id)}">Изменить</button><button class="btn danger" data-a="deldish" data-id="${esc(id)}">Удалить</button></div>`);
}
function openSettings(){
  const t = lastSync ? new Date(lastSync) : null;
  openSheet(`<div class="sh-title">База и аккаунт</div>
    <div class="kv">
      <div><span>Статус</span><b>${syncState==='ok'?'Всё сохранено':syncState==='saving'?'Сохраняю…':esc(syncErr||'Нет связи')}</b></div>
      <div><span>Не записано изменений</span><b>${queue.length}</b></div>
      <div><span>Последняя синхронизация</span><b>${t?pad(t.getHours())+':'+pad(t.getMinutes())+', '+dLabel(t):'—'}</b></div>
      <div><span>База</span><b>${cfg?esc(cfg.owner+'/'+cfg.repo):'—'}</b></div>
    </div>
    <button class="btn primary wide" data-a="syncnow">Синхронизировать сейчас</button>
    <button class="btn wide" data-a="changetoken">Сменить токен или репозиторий</button>
    <button class="btn wide danger" data-a="logout">Выйти</button>`);
}

/* ===== Редактор блюда ===== */
function ingOptions(sel){
  const I=ING(), by={};
  Object.entries(I).forEach(([k,x])=>{(by[x.c]=by[x.c]||[]).push([k,x.n])});
  const cats=[...CATS.filter(c=>by[c]), ...Object.keys(by).filter(c=>!CATS.includes(c))];
  return cats.map(c=>`<optgroup label="${esc(c)}">${by[c].sort((a,b)=>a[1].localeCompare(b[1],'ru')).map(([k,n])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(n)}</option>`).join('')}</optgroup>`).join('');
}
function openEditor(id){
  const d = id ? dishMap()[id] : null;
  ed = {id: d?d.id:'d'+Date.now().toString(36), exists:!!d, name:d?d.name:'', time:d?(d.time||''):'',
        items: d?clone(d.items):[['chicken',150,200],['rice',55,80],['oil',5,5]],
        extra: d?(d.extra||[]).join(', '):'', steps: d?(d.steps||[]).join('\n'):'', newIng:false};
  renderEditor(false);
}
function renderEditor(keep){
  const cats = CATS.filter(c=>!['Специи и мелочи','Своё'].includes(c));
  openSheet(`<div class="sh-title">${ed.exists?'Изменить блюдо':'Новое блюдо'}</div>
    <label class="fl">Название<input data-ed="name" value="${esc(ed.name)}" placeholder="Например: грудка с овощами + рис"></label>
    <label class="fl">Время готовки<input data-ed="time" value="${esc(ed.time)}" placeholder="30 мин"></label>
    <div class="fl">Продукты на одну порцию, г (сырой / сухой вес)</div>
    <div class="ed-head"><span>Продукт</span><span>${WHO[0]}</span><span>${WHO[1]}</span><span></span></div>
    ${ed.items.map((it,i)=>`<div class="ed-row"><select data-ed-sel="${i}">${ingOptions(it[0])}</select><input inputmode="decimal" data-ed-g="${i},1" value="${num(it[1])}"><input inputmode="decimal" data-ed-g="${i},2" value="${num(it[2])}"><button class="del" data-ed-del="${i}" aria-label="Убрать">×</button></div>`).join('')}
    <div class="toolbar"><button class="btn" data-a="ed-addrow">+ Продукт</button><button class="btn" data-a="ed-newing">${ed.newIng?'Скрыть':'+ Новый продукт'}</button></div>
    ${ed.newIng?`<div class="newing"><div class="fl">Новый продукт в базу · КБЖУ на 100 г (с упаковки)</div>
      <input id="niName" placeholder="Название, например: Индейка">
      <select id="niCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
      <div class="ni-grid"><input id="niK" inputmode="decimal" placeholder="Ккал"><input id="niP" inputmode="decimal" placeholder="Б"><input id="niF" inputmode="decimal" placeholder="Ж"><input id="niU" inputmode="decimal" placeholder="У"></div>
      <button class="btn primary wide" data-a="ed-saveing">Добавить продукт</button></div>`:''}
    <div class="fl">КБЖУ порции</div>
    <div id="edPrev" class="macros"></div>
    <label class="fl">Специи и мелочи — через запятую<input data-ed="extra" value="${esc(ed.extra)}" placeholder="Чеснок, паприка, соль"></label>
    <label class="fl">Рецепт — каждый шаг с новой строки<textarea data-ed="steps" rows="7" placeholder="Духовку разогреть до 200°.&#10;Филе нарезать…">${esc(ed.steps)}</textarea></label>
    <div class="ed-err" id="edErr"></div>
    <div class="toolbar"><button class="btn" data-close="1">Отмена</button><button class="btn primary" data-a="ed-save">Сохранить</button></div>`, keep);
  updPrev();
}
function updPrev(){ const el=$('edPrev'); if(el&&ed) el.innerHTML=macBox(0,macro(ed.items,1))+macBox(1,macro(ed.items,2)) }

/* ===== Подтверждение двойным тапом ===== */
function twoTap(btn,txt,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1'; const old=btn.textContent; btn.textContent=txt; btn.classList.add('confirm');
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('confirm')}},3000);
}

/* ===== Рендер ===== */
function render(){
  if(!db) return;
  const y=window.scrollY;
  $('app').innerHTML = tab==='week'?renderWeek():tab==='dishes'?renderDishes():tab==='shop'?renderShop():renderToday();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(window.scrollY!==y) window.scrollTo(0,y);
  setStatus(syncState, syncErr);
}

/* ===== События ===== */
document.addEventListener('click',e=>{
  if(!started) return;
  const t=e.target, q=sel=>t.closest(sel);
  let el;
  if((el=q('[data-close]'))){ closeSheet(); return }
  if((el=q('[data-tab]'))){
    const nt=el.dataset.tab;
    if(nt==='today' && tab==='today') selDay=(new Date().getDay()+6)%7;
    if(nt!=='week') swapFrom=null;
    tab=nt; save('m.tab',tab); closeSheet(); render(); window.scrollTo(0,0); return;
  }
  if((el=q('[data-day]'))){ selDay=Number(el.dataset.day); render(); return }
  if((el=q('[data-week]'))){ weekOff=Number(el.dataset.week); swapFrom=null; render(); return }
  if((el=q('[data-slot]'))){
    const [d,s]=el.dataset.slot.split(',').map(Number), wk=ymd(viewMon());
    if(swapFrom){
      if(!(swapFrom.d===d&&swapFrom.s===s)){
        const p=getPlan(wk), A=p[swapFrom.d][swapFrom.s], B=p[d][s];
        setSlot(wk,swapFrom.d,swapFrom.s,B); setSlot(wk,d,s,A);
      }
      swapFrom=null; render(); return;
    }
    openSlotSheet(d,s); return;
  }
  if((el=q('[data-pick]'))){ setSlot(ymd(viewMon()),pickTarget.d,pickTarget.s,el.dataset.pick); closeSheet(); render(); return }
  if((el=q('[data-dish]'))){ openDishView(el.dataset.dish); return }
  if((el=q('[data-ed-del]'))){ ed.items.splice(Number(el.dataset.edDel),1); renderEditor(true); return }
  if((el=q('[data-del]'))){ e.stopPropagation(); doOp({t:'shopDel',wk:ymd(viewMon()),id:Number(el.dataset.del)}); render(); return }
  if((el=q('.row[data-id]'))){
    const wk=ymd(viewMon()), id=el.dataset.id, v=!(shopState(wk).checked||{})[id];
    doOp({t:'check',wk,id,v}); render(); return;
  }
  if(!(el=q('[data-a]'))) return;
  const a=el.dataset.a, wk=ymd(viewMon());
  switch(a){
    case 'swapcancel': swapFrom=null; render(); break;
    case 'pick': openPicker(slotCtx.d,slotCtx.s); break;
    case 'repeat': { const p=getPlan(wk); setSlot(wk,slotCtx.d+1,slotCtx.s,p[slotCtx.d][slotCtx.s]); closeSheet(); render(); break }
    case 'swap': swapFrom=slotCtx; closeSheet(); render(); break;
    case 'clearslot': setSlot(wk,slotCtx.d,slotCtx.s,null); closeSheet(); render(); break;
    case 'viewslot': { const p=getPlan(wk), b=batchInfo(p,slotCtx.d,slotCtx.s); openDishView(p[slotCtx.d][slotCtx.s], b?b.n:2); break }
    case 'copyprev': twoTap(el,'Заменить неделю?',()=>{ const prev=db.plans[ymd(addDays(viewMon(),-7))]; doOp({t:'plan',wk,plan:prev||db.defaultPlan}); swapFrom=null; render() }); break;
    case 'stdplan': twoTap(el,'Заменить неделю?',()=>{ doOp({t:'plan',wk,plan:db.defaultPlan}); swapFrom=null; render() }); break;
    case 'clearweek': twoTap(el,'Точно очистить?',()=>{ doOp({t:'plan',wk,plan:emptyPlan()}); swapFrom=null; render() }); break;
    case 'newdish': openEditor(null); break;
    case 'editdish': openEditor(el.dataset.id); break;
    case 'deldish': twoTap(el,'Точно удалить?',()=>{ doOp({t:'delDish',id:el.dataset.id}); closeSheet(); render() }); break;
    case 'ed-addrow': ed.items.push(['chicken',0,0]); renderEditor(true); break;
    case 'ed-newing': ed.newIng=!ed.newIng; renderEditor(true); break;
    case 'ed-saveing': {
      const name=$('niName').value.trim(); if(!name){ $('niName').focus(); break }
      const key='x'+Date.now().toString(36);
      doOp({t:'ing', key, val:{n:name, c:$('niCat').value, k:num($('niK').value), p:num($('niP').value), f:num($('niF').value), u:num($('niU').value)}});
      ed.items.push([key,100,100]); ed.newIng=false; renderEditor(true); break;
    }
    case 'ed-save': {
      const name=ed.name.trim(), items=ed.items.filter(it=>num(it[1])+num(it[2])>0).map(it=>[it[0],num(it[1]),num(it[2])]);
      if(!name){ $('edErr').textContent='Введи название блюда'; break }
      if(!items.length){ $('edErr').textContent='Добавь хотя бы один продукт с граммовкой'; break }
      doOp({t:'dish', dish:{id:ed.id, name, time:ed.time.trim(), items,
        extra:ed.extra.split(',').map(x=>x.trim()).filter(Boolean),
        steps:ed.steps.split('\n').map(x=>x.trim()).filter(Boolean)}});
      if(pickTarget) setSlot(wk,pickTarget.d,pickTarget.s,ed.id);
      closeSheet(); render(); break;
    }
    case 'hide': hide=!hide; save('m.hide',hide); render(); break;
    case 'reset': twoTap(el,'Точно сбросить?',()=>{ doOp({t:'reset',wk}); render() }); break;
    case 'settings': openSettings(); break;
    case 'syncnow': (queue.length?flush():refresh()).then(()=>{ if($('sheet').classList.contains('open')) openSettings() }); break;
    case 'changetoken': closeSheet(); showLogin(true); break;
    case 'logout': twoTap(el,'Точно выйти?',()=>{ ['m.auth','m.cfg','m.db','m.remote','m.sha','m.queue'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}}); location.reload() }); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pickSearch'){
    const v=t.value.trim().toLowerCase();
    document.querySelectorAll('#pickList .dishrow').forEach(r=>{r.style.display=r.dataset.name.includes(v)?'':'none'});
    return;
  }
  if(!ed) return;
  if(t.dataset.ed){ ed[t.dataset.ed]=t.value; return }
  if(t.dataset.edG){ const [i,j]=t.dataset.edG.split(',').map(Number); ed.items[i][j]=num(t.value); updPrev() }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(ed && t.dataset.edSel!==undefined){ ed.items[Number(t.dataset.edSel)][0]=t.value; updPrev() }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addForm') return;
  e.preventDefault();
  const n=$('addIn').value.trim(); if(!n) return;
  doOp({t:'shopAdd', wk:ymd(viewMon()), item:{id:Date.now(), n}});
  render(); $('addIn').focus();
});

/* ===== Шторка: свайп вниз закрывает, фон не прокручивается ===== */
(function(){
  let y0=null, dy=0, fromTop=false;
  const box=()=>$('sheetBox');
  document.addEventListener('touchstart',e=>{
    if(!sheetOpen||!box().contains(e.target)) { y0=null; return }
    if(e.target.closest('input,textarea,select')) { y0=null; return }
    y0=e.touches[0].clientY; dy=0; fromTop = box().scrollTop<=0;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!sheetOpen) return;
    if(e.target.closest && e.target.closest('.sheet-bg')) { e.preventDefault(); return }   // фон не тянется
    if(y0==null||!fromTop) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0 && box().scrollTop<=0){ e.preventDefault(); box().style.transform=`translateY(${dy}px)` }
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(y0==null) return;
    if(dy>90) closeSheet(); else box().style.transform='';
    y0=null; dy=0;
  },{passive:true});
})();

/* ===== Без масштабирования (щипок и двойной тап) ===== */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches&&e.touches.length>1) e.preventDefault() },{passive:false});

document.addEventListener('keydown',e=>{ if(e.key==='Escape' && sheetOpen) closeSheet() });

/* ===== Вход ===== */
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function checkPassword(user,pass){
  if(!AUTH) return true;
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toLowerCase()+':'+pass), 'PBKDF2', false, ['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64d(AUTH.salt), iterations:AUTH.iter, hash:'SHA-256'}, base, 256);
  return b64e(bits)===AUTH.hash;
}
function showLogin(onlyDb){
  document.body.classList.remove('ready');
  $('lgOwner').value = cfg?cfg.owner:DEFAULT_OWNER;
  $('lgRepo').value  = cfg?cfg.repo:DEFAULT_REPO;
  $('lgToken').value = '';
  $('lgToken').placeholder = cfg?'Новый токен (или оставь пустым)':'Токен GitHub (github_pat_…)';
  $('lgDb').style.display = (!cfg||onlyDb)?'':'none';
  $('lgErr').textContent='';
}
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=$('lgBtn'), err=$('lgErr');
  btn.disabled=true; btn.textContent='Проверяю…'; err.textContent='';
  const fail = m => { err.textContent=m; btn.disabled=false; btn.textContent='Войти' };
  try{
    if(!window.crypto||!crypto.subtle) return fail('Открой сайт по https');
    if(!(await checkPassword($('lgUser').value,$('lgPass').value))) return fail('Неверный логин или пароль');
    const owner=$('lgOwner').value.trim(), repo=$('lgRepo').value.trim(), token=$('lgToken').value.trim() || (cfg&&cfg.token) || '';
    if(!owner||!repo||!token) return fail('Заполни подключение к базе');
    const prevCfg=cfg; cfg={owner,repo,token};
    try{ await refresh(true) }catch(ex){ cfg=prevCfg; return fail(errText(ex)) }
    if(!remote){ cfg=prevCfg; return fail('Не удалось загрузить базу') }
    save('m.cfg',cfg); save('m.auth',true);
    btn.disabled=false; btn.textContent='Войти';
    start();
  }catch(ex){ fail('Ошибка: '+(ex&&ex.message||ex)) }
});

/* ===== Старт ===== */
function start(){
  started=true;
  weekOff = nextShopOff();
  const before = ymd(addDays(thisMon(),-28));
  if(Object.keys(db.plans).concat(Object.keys(db.shop)).some(k=>k<before)) doOp({t:'prune',before});
  document.body.classList.add('ready');
  render();
  if(queue.length) scheduleFlush(0);
}
(function boot(){
  if(load('m.auth',false) && cfg){
    if(db){ db=norm(db); start(); refresh(); }
    else refresh(true).then(()=>{ if(db) start(); else showLogin(true) }).catch(e=>{ showLogin(true); $('lgErr').textContent=errText(e) });
  } else showLogin(false);
})();
</script>
